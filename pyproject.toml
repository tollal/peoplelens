[project]
name = "peoplelens"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tolga", email = "altolgag@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "pandas>=3.0.6",
    "pandera>=0.33.1",
    "polars>=1.44.2",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.65.0",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
